
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | TS Authentication</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="card">
      <a class="brand" href="index.html">TS<span>.</span></a>
      <p class="eyebrow">GET STARTED</p>
      <h1>Create your account</h1>
      <p class="muted">Fill in your information below.</p>

      <form id="registerForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text"
          minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+"
          placeholder="Your username" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email"
          placeholder="example@email.com" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
          minlength="8" maxlength="128"
          placeholder="At least 8 characters" required>

        <label for="adminPassword">Admin Registration Password
          <span class="optional">(Optional)</span>
        </label>
        <input id="adminPassword" name="adminPassword" type="password"
          placeholder="Leave empty for a regular account">

        <button class="btn primary full" type="submit">Create Account</button>
        <p id="message" class="message"></p>
      </form>

      <div class="links">
        <span>Already have an account? <a href="login.html">Login</a></span>
      </div>
    </section>
  </main>
</body>
</html>
