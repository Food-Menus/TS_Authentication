
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | TS Authentication</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/reset-password.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="card">
      <a class="brand" href="index.html">TS<span>.</span></a>
      <p class="eyebrow">NEW PASSWORD</p>
      <h1>Reset Password</h1>
      <p class="muted">Create a new password for your account.</p>

      <form id="resetPasswordForm">
        <label for="newPassword">New Password</label>
        <input id="newPassword" name="newPassword" type="password"
          placeholder="Enter new password" required minlength="8">

        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password"
          placeholder="Confirm new password" required minlength="8">

        <button class="btn primary full" type="submit">
          Reset Password
        </button>

        <p id="message" class="message" aria-live="polite"></p>
      </form>

      <div class="links">
        <a href="login.html">Back to Login</a>
      </div>
    </section>
  </main>
  <script src="js/api.js" defer></script>
<script src="js/reset-password.js" defer></script>
</body>
</html>
