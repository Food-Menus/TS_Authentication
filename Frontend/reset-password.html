
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | TS Authentication</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="card">
      <a class="brand" href="index.html">TS<span>.</span></a>
      <p class="eyebrow">NEW PASSWORD</p>
      <h1>Reset your password</h1>
      <p class="muted">
        Enter the code sent to your email and choose a new password.
      </p>

      <form id="resetForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email"
          placeholder="example@email.com" required>

        <label for="otp">Verification Code</label>
        <input id="otp" name="otp" type="text"
          inputmode="numeric" pattern="[0-9]{6}"
          minlength="6" maxlength="6"
          placeholder="6-digit code" required>

        <label for="newPassword">New Password</label>
        <input id="newPassword" name="newPassword" type="password"
          minlength="8" maxlength="128"
          placeholder="At least 8 characters" required>

        <button class="btn primary full" type="submit">
          Reset Password
        </button>
        <p id="message" class="message"></p>
      </form>

      <div class="links">
        <a href="forgot-password.html">Request another code</a>
        <a href="login.html">Back to Login</a>
      </div>
    </section>
  </main>
</body>
</html>
