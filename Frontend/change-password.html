
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password | TS Authentication</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/change-password.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="card">
      <a class="brand" href="index.html">TS<span>.</span></a>
      <p class="eyebrow">ACCOUNT SECURITY</p>
      <h1>Change Password</h1>
      <p class="muted">Update your account password.</p>

      <form id="changePasswordForm">
        <label for="currentPassword">Current Password</label>
        <input id="currentPassword" name="currentPassword"
          type="password" placeholder="Enter current password" required>

        <label for="newPassword">New Password</label>
        <input id="newPassword" name="newPassword"
          type="password" placeholder="Enter new password"
          required minlength="8">

        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" name="confirmPassword"
          type="password" placeholder="Confirm new password"
          required minlength="8">

        <button class="btn primary full" type="submit">
          Update Password
        </button>

        <p id="message" class="message" aria-live="polite"></p>
      </form>

      <div class="links">
        <a href="dashboard.html">Back to Dashboard</a>
      </div>
    </section>
  </main>
</body>
</html>
