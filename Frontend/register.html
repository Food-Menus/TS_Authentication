
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | TS Authentication</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/register.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="card">
      <a class="brand" href="index.html">TS<span>.</span></a>
      <p class="eyebrow">GET STARTED</p>
      <h1>Create Account</h1>
      <p class="muted">Create your account to get started.</p>

      <form id="registerForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text"
          placeholder="Enter username" required minlength="3" maxlength="30">

        <label for="email">Email</label>
        <input id="email" name="email" type="email"
          placeholder="example@email.com" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
          placeholder="Enter password" required minlength="8">

        <label for="adminPassword">Admin Registration Password (Optional)</label>
        <input id="adminPassword" name="adminPassword" type="password"
          placeholder="Admin password">

        <button class="btn primary full" type="submit">
          Create Account
        </button>

        <p id="message" class="message" aria-live="polite"></p>
      </form>

      <div class="links">
        <span>Already have an account?</span>
        <a href="login.html">Login</a>
      </div>
    </section>
  </main>
</body>
</html>
